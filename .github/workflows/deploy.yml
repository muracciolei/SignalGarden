name: Deploy Signal Garden

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Publish gh-pages branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin gh-pages --depth=1 || true
          if git rev-parse --verify origin/gh-pages >/dev/null 2>&1; then
            git worktree add ../gh-pages origin/gh-pages
          else
            git worktree add --detach ../gh-pages
            (cd ../gh-pages && git switch --orphan gh-pages)
          fi

          find ../gh-pages -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -R dist/. ../gh-pages/
          touch ../gh-pages/.nojekyll

          cd ../gh-pages
          git add -A
          git commit -m "Deploy Signal Garden" || exit 0
          git push origin HEAD:gh-pages --force
